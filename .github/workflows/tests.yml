name: tests
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['5.7', '5.10', '6.0']
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
