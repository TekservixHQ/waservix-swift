# Lints (and runs the tests of) the Objective-C pod; publishes it to CocoaPods trunk on objc-v1.2.3 tags.
name: cocoapods-objc

on:
  push:
    branches: [main]
    paths: ['ObjC/**', 'WAservixObjC.podspec', '.github/workflows/cocoapods-objc.yml']
    tags: ['objc-v*.*.*']
  workflow_dispatch:

jobs:
  pod:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the podspec version
        if: startsWith(github.ref, 'refs/tags/objc-v')
        run: |
          v=$(grep -E "s.version *=" WAservixObjC.podspec | sed -E "s/.*'([^']+)'.*/\1/")
          test "objc-v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != podspec $v"; exit 1; }
      - run: pod --version
      - run: pod lib lint WAservixObjC.podspec --allow-warnings --platforms=ios,macos --verbose | tail -60
        shell: bash -eo pipefail {0}
      - name: Publish to CocoaPods trunk
        if: startsWith(github.ref, 'refs/tags/objc-v')
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push WAservixObjC.podspec --allow-warnings
