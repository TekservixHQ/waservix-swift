# Lints the podspec on every push; publishes to CocoaPods trunk when a version tag (v1.2.3) is pushed.
name: cocoapods

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  pod:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the podspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep -E "s.version *=" WAservix.podspec | sed -E "s/.*'([^']+)'.*/\1/")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != podspec $v"; exit 1; }
      - run: pod --version
      - run: pod lib lint WAservix.podspec --allow-warnings --platforms=ios,macos
      - name: Publish to CocoaPods trunk
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push WAservix.podspec --allow-warnings
